name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: node --test test/*.test.mjs

  pack:
    name: Pack tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: pnpm pack

      - name: Verify tarball contents
        run: |
          set -euo pipefail
          TARBALL="$(printf '%s\n' black-market-sdk-*.tgz | sed -n '1p')"
          CONTENTS="$(tar -tzf "$TARBALL")"
          grep -qx 'package/dist/index\.js' <<<"$CONTENTS"
          grep -qx 'package/dist/index\.d\.ts' <<<"$CONTENTS"
          grep -qx 'package/README\.md' <<<"$CONTENTS"
          grep -qx 'package/LICENSE' <<<"$CONTENTS"
          grep -qx 'package/package\.json' <<<"$CONTENTS"
          echo "tarball contents OK: $TARBALL"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: black-market-sdk-*.tgz
          retention-days: 7

  install-smoke:
    name: Install smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Install packed tarball into a fresh project
        run: |
          set -euo pipefail
          mkdir smoke
          cd smoke
          pnpm init
          pnpm add ../black-market-sdk-*.tgz

      - name: Import smoke
        working-directory: smoke
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFile } from 'node:fs/promises';
            import * as sdk from '@black-market/sdk';
            import * as lifecycle from '@black-market/sdk/lifecycle';
            const fixture = JSON.parse(await readFile('../test/fixtures/launch-lifecycle-v1.json', 'utf8'));
            for (const api of [sdk, lifecycle]) {
              const plan = api.parseLaunchPlan(JSON.stringify(fixture.plan));
              assert.equal(api.encodeLaunchPlan(plan), fixture.encodedPlan);
              assert.equal(api.hashLaunchPlan(plan), fixture.planHash);
              assert.equal(api.hashLaunchIdentity(plan), fixture.launchId);
              assert.deepEqual(api.parseLaunchPlan(api.serializeLaunchPlan(plan)), plan);
            }
            console.log('packed lifecycle commitment smoke OK:', fixture.planHash);
          "
